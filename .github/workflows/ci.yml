name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv pip install --system ".[dev]"

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run Unit Tests with Pytest
        run: |
          pytest --ignore=tests/ml/test_pipeline.py --ignore=tests/backend/test_duckdb.py
