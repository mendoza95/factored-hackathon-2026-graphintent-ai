[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dispute-agent-ai"
version = "0.1.0"
description = "AI Agent for Transaction Disputes powered by Graph Coloring Scheduler"
authors = [{ name = "Your Name" }]
requires-python = ">=3.11"
dependencies = [
    # Core app & ML dependencies
    "cloudpickle>=3.0.0",
    "duckdb>=0.9.0",
    "joblib>=1.3.0",
    "nest-asyncio2>=0.1.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "threadpoolctl>=3.2.0",
]

[project.optional-dependencies]
dev = [
    # Code formatting & linting
    "ruff>=0.16.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.21.0",
    # Notebooks, interactive execution & debugging
    "appnope",
    "asttokens",
    "comm",
    "debugpy",
    "executing",
    "fastjsonschema",
    "ipykernel",
    "ipython",
    "ipython-pygments-lexers",
    "jedi",
    "jupyter-client",
    "jupyter-core",
    "matplotlib-inline",
    "nbformat",
    "nbstripout",
    "parso",
    "pexpect",
    "platformdirs",
    "prompt-toolkit",
    "psutil",
    "ptyprocess",
    "pure-eval",
    "pyzmq",
    "stack-data",
    "tornado",
    "traitlets",
    "wcwidth",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]